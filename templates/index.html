<!DOCTYPE html>
<html>
<head>
    <title>Stroke Risk Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Stroke Risk Prediction</h1>

    <form action="/predict" method="POST">

        <label>Gender</label>
        <select name="gender" required>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
        </select>

        <label>Age</label>
        <input type="number" name="age" step="0.1" required>

        <label>Hypertension</label>
        <select name="hypertension" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Heart Disease</label>
        <select name="heart_disease" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Ever Married</label>
        <select name="ever_married" required>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Work Type</label>
        <select name="work_type" required>
            <option value="Private">Private</option>
            <option value="Self-employed">Self-employed</option>
            <option value="Govt_job">Govt Job</option>
            <option value="children">Children</option>
            <option value="Never_worked">Never Worked</option>
        </select>

        <label>Residence Type</label>
        <select name="Residence_type" required>
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
        </select>

        <label>Average Glucose Level</label>
        <input type="number" name="avg_glucose_level" step="0.01" required>

        <label>BMI</label>
        <input type="number" name="bmi" step="0.1" required>

        <label>Smoking Status</label>
        <select name="smoking_status" required>
            <option value="never smoked">Never Smoked</option>
            <option value="formerly smoked">Formerly Smoked</option>
            <option value="smokes">Smokes</option>
            <option value="Unknown">Unknown</option>
        </select>

        <button type="submit">Predict Stroke Risk</button>

    </form>

    {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
